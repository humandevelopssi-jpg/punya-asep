<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>3. Komparasi Gaji Terhadap RKAP</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;padding:20px;color:#1e293b}
.dashboard{max-width:1200px;margin:0 auto}
.main-header{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:25px 30px;border-radius:14px;margin-bottom:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.main-header h1{font-size:22px;font-weight:700}
.main-header p{font-size:14px;opacity:.8;margin-top:5px}
.data-section{background:#fff;border-radius:14px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}
.kpi-card{background:#f8fafc;border-radius:10px;padding:15px;border-left:5px solid #3b82f6;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
.kpi-card.green{border-left-color:#16a34a}.kpi-card.red{border-left-color:#dc2626}.kpi-card.orange{border-left-color:#f59e0b}
.kpi-card .label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#64748b;font-weight:700;margin-bottom:5px}
.kpi-card .value{font-size:20px;font-weight:800;color:#1e293b}
.kpi-card .desc{font-size:12px;color:#64748b;margin-top:5px}
.table-container{overflow-x:auto;margin-bottom:25px;border-radius:8px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}
thead th{padding:12px 8px;font-weight:700;font-size:11px;text-transform:uppercase;color:#fff;border-right:1px solid rgba(255,255,255,.15)}
thead th:last-child{border-right:none}
.h-b,.h-tot{background:#dc2626}.h-ang{background:#64748b}.h-diff{background:#facc15;color:#1e293b}
tbody td{padding:10px 8px;border-bottom:1px solid #e2e8f0;color:#334155;text-align:center}
tbody tr:nth-child(even){background:#f8fafc}
.diff-plus{color:#16a34a;font-weight:800;background:#f0fdf4}
.diff-minus{color:#dc2626;font-weight:800;background:#fef2f2}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:15px}
.chart-card h3{font-size:13px;font-weight:700;margin-bottom:15px;color:#475569;text-align:center}
.canvas-container{position:relative;height:280px}

/* STYLE HIGHLIGHT KHUSUS NO. 3 */
.highlight-box{background:#fef2f2;border-left:5px solid #dc2626;border-radius:8px;padding:20px;margin-top:20px;box-shadow:0 4px 10px rgba(0,0,0,.03)}
.highlight-box h4{font-size:15px;font-weight:800;margin-bottom:12px;color:#1e293b}
.highlight-content{font-size:13.5px;line-height:1.8;color:#1e293b}
.highlight-content .p-1{margin-bottom:15px;}
.highlight-content .p-2{margin-bottom:15px;}
.highlight-content .p-3{margin-bottom:5px;}
.highlight-content .desc-list{margin-top:5px; font-size:12.5px; line-height:1.6; padding-left:20px;}
.highlight-content .desc-list div{margin-bottom:8px;}
.highlight-content b { color: #0f172a; }
</style>
</head>
<body>
<div class="dashboard">
    <div class="main-header">
        <h1>3. Komparasi Gaji Terhadap RKAP</h1>
        <p>Update Data: <b>23 Oktober 2026</b> | PT. Swadharma Sarana Informatika</p>
    </div>
    <div class="data-section">
        <div id="dataContent"></div>
    </div>
</div>

<script src="data.js"></script>
<script>
function fNum(num) { return num.toLocaleString('id-ID'); }

// Data RKAP Historis (Update Okt: Realisasi 31322, Defisit -899)
var histGaji = [28618, 30028, 31252, 30036, 29928, 29878, 29980, 30363, 30681, 31322];
var histAnggaran = [30422, 30422, 30422, 30422, 30422, 30422, 30422, 30422, 30422, 30422];
var histDiff = [1804, 394, -829, 386, 495, 545, 443, 59, -258, -899];
var labelsBulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sept', 'Okt'];

var tblRkap = '';
for(var i=0; i<labelsBulan.length; i++) {
    var hl = (labelsBulan[i] === 'Okt') ? 'style="background:#fffbeb;font-weight:bold;"' : '';
    var diffClass = histDiff[i] >= 0 ? 'diff-plus' : 'diff-minus';
    tblRkap += `<tr ${hl}>
        <td>${labelsBulan[i]}</td>
        <td>${fNum(histGaji[i])}</td>
        <td>${fNum(histAnggaran[i])}</td>
        <td class="${diffClass}">${histDiff[i] >= 0 ? '+' : ''}${fNum(histDiff[i])}</td>
    </tr>`;
}

var content = `
    <div class="kpi-grid">
        <div class="kpi-card orange"><div class="label">Realisasi Okt</div><div class="value">Rp 31.322 Jt</div></div>
        <div class="kpi-card blue"><div class="label">Anggaran (RKAP)</div><div class="value">Rp 30.422 Jt</div></div>
        <div class="kpi-card red"><div class="label">Defisit Okt</div><div class="value">-Rp 899 Jt</div><div class="desc">Terdalam 2026</div></div>
        <div class="kpi-card green"><div class="label">Surplus Tertinggi</div><div class="value">Jan</div><div class="desc">+Rp 1.804 Jt</div></div>
    </div>
    <div class="table-container">
        <table>
            <thead><tr><th class="h-b">Bulan</th><th class="h-tot">Realisasi Gaji</th><th class="h-ang">Anggaran RKAP</th><th class="h-diff">+/-</th></tr></thead>
            <tbody>${tblRkap}</tbody>
        </table>
    </div>
    <div class="chart-grid">
        <div class="chart-card"><h3>📈 Kurva Realisasi vs Anggaran</h3><div class="canvas-container"><canvas id="chartRkapLine"></canvas></div></div>
        <div class="chart-card"><h3>📊 Defisit/Surplus Per Bulan</h3><div class="canvas-container"><canvas id="chartRkapBar"></canvas></div></div>
    </div>
    
    <div class="highlight-box">
        <h4>⚠️ Highlight :</h4>
        <div class="highlight-content">
            <div class="p-1">
                <b>3.1</b> Anggaran RKAP Th. 2026 <b>(Rp 30.422 Milyar)</b> All beban gaji pegawai SSI/JST/DIKA/GLO/BCA pada Q-4 ini mengalami <b>Defisit Anggaran sebesar +/- Rp. 899 Juta</b> atau naik <b>2,96%</b> dibandingkan posisi terakhir bulan September 2026 <i>(Realisasi Rp 31.322 Jt vs Anggaran Rp 30.422 Jt)</i>.
            </div>
            <div class="p-2">
                <b>3.2 Implikasi</b> - Defisit yang konsisten di Q3 dan Q4 mengindikasikan perlunya adanya <b>kolaborasi</b> dan <b>realokasi anggaran</b> atau <b>efisiensi komponen JST</b> yang mendominasi -/+ 76,02% total gaji.
            </div>
            <div class="p-3">
                <b>3.3 Rekomendasi Tindak lanjut :</b>
            </div>
            <div class="desc-list">
                <div><b>a. Hold/Prioritaskan Rekrutmen :</b> Tunda penambahan pegawai baru (non-kritis) di sisa tahun 2026 guna menahan laju kenaikan beban gaji;</div>
                <div><b>b. Melakukan identifikasi COU mana yang memiliki jumlah "Over Capacity" SDM</b> sesuai Rasio terhadap jumlah kelolaan ATM;</div>
                <div><b>c. Sinkronisasi HC & OPS:</b> Pastikan efisiensi anggaran tidak mengorbankan pencapaian SLA, agar terhindar dari denda (Penalty) operasional di akhir tahun.</div>
            </div>
        </div>
    </div>
`;
document.getElementById('dataContent').innerHTML = content;

setTimeout(() => {
    new Chart(document.getElementById('chartRkapLine'), { 
        type: 'line', 
        data: { labels: labelsBulan, datasets: [
            { label: 'Realisasi', data: histGaji, borderColor: '#dc2626', borderWidth: 3, tension: 0.4 }, 
            { label: 'Anggaran', data: histAnggaran, borderColor: '#3b82f6', borderWidth: 2, borderDash: [5,5], tension: 0.4 }
        ] }, 
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } } 
    });
    
    new Chart(document.getElementById('chartRkapBar'), { 
        type: 'bar', 
        data: { labels: labelsBulan, datasets: [
            { label: 'Defisit/Surplus', data: histDiff, backgroundColor: histDiff.map(d => d >= 0 ? '#16a34a' : '#dc2626'), borderRadius: 4 }
        ] }, 
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } 
    });
}, 100);
</script>
</body>
</html>
